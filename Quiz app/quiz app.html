<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="quiz app.css">
</head>
<body>
    <div class="container">
        <div class="quiz-app">
            <div class="quiz-info">
                <div class="category">Category: <span>HTMl</span></div>
                <div class="count">Questions Count: <span></span></div>
            </div>
            <div class="question">
                <h2>Are You Good ?</h2>
            </div>
            <div class="answers">
                <div class="choice">
                    <input type="radio" id="answer_1" name="choice">
                    <label for="answer_1">nnnnnn</label>
                </div>
                <div class="choice">
                    <input type="radio" id="answer_2" name="choice">
                    <label for="answer_2">nnnnnn</label>
                </div>
                <div class="choice">
                    <input type="radio" id="answer_3" name="choice">
                    <label for="answer_3">nnnnnn</label>
                </div>
                <div class="choice">
                    <input type="radio" id="answer_4" name="choice">
                    <label for="answer_4">nnnnnn</label>
                </div>
            </div>
            <button class="submit-button">Submit</button>
            <div class="bullets">
                <div class="spans"></div>
            </div>
            <!-- <div class="right_answer"></div> -->
            <div class="count-down">
                <span class="minutes">02</span> :
                <span class="second">45</span>
            </div>
        </div>
        <div class="result"> <span class="perfect">perfect </span> you are good</div>
    </div>
    <script src="quiz app.js"></script>
</body>
</html>
