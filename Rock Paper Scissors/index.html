<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <!-- <style >
  
    </style> -->
    <link rel="stylesheet" href="rock-paper-scissors.css">
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>

    <button
      onclick="
      ComputerMove = PickComputerMove();
      PlayGame('Rock');
    " class="move-button"> <img src="images/Rock-emoji.png" class="move-icon"> </button>

    <button
      onclick="
      ComputerMove = PickComputerMove();
      PlayGame('Paper');
    " class="move-button"> <img src="images/Paper-emoji.png" class="move-icon">  </button>

    <button
      onclick="
      ComputerMove = PickComputerMove();
      PlayGame('Scissors');
    " class="move-button"> <img src="images/Scissors-emoji.png" class="move-icon">  </button>

    <p class="js-result"></p>
    <p class="js-moves"></p>
    <p class="js-score"></p>

    <button onclick="
        score.wins =0;
        score.loses =0;
        score.ties =0;
        localStorage.removeItem('score');
        updateScore();
        undateHappened();
    "class="reset-score-button" > Reset Score</button>

    <button class="jv-auto-play-button auto-play-button" onclick="
    autoPlay();
    "> Auto Play </button>

    <script 
      src ="rock-paper-scissors.js">
    </script>
  </body>
</html>
