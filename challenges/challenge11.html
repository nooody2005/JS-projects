<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo</title>
    <style>
        .container{
            margin: 20px auto;
            width: 500px;
        }
        .container .input{
            padding: 20px;
            background-color: antiquewhite;
            display: flex;
            justify-content:space-between;
            margin-bottom: 20px;
        }
        .container .input input{
            width: 70%;
            height: 30px;
        }
        .container .input .add-btn{
           width:20%;
           cursor: pointer;
        }
        .container .result-container .box{
            display: flex;
            justify-content:space-between;
            align-items: center;
            margin-bottom:20px;
            border-bottom: 1px solid #fff;
            background-color: antiquewhite;
            padding: 20px;
        }
        .container .result-container .delete{
            height: fit-content;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="input">
            <input type="text">
            <button class="add-btn">add</button>
        </div>
        <div class="result-container">
            <!-- <div class="box">
                <p class="result">aaaaaaa</p>
                <button class="delete">dalete</button>
            </div>
            <div class="box">
                <p class="result">aaaaaaa</p>
                <button class="delete">dalete</button>
            </div>
            <div class="box">
                <p class="result">aaaaaaa</p>
                <button class="delete">dalete</button>
            </div> -->
        </div>
    </div>
    <script>
       
        let input = document.querySelector('input');
        let addBtn = document.querySelector('.add-btn');
        let resultContainer = document.querySelector('.result-container');

        // Load tasks from localStorage or empty array
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        // Display existing tasks
        tasks.forEach(task => {
            createTask(task);
        });

        // Add button click
        addBtn.onclick = function() {
            add();
        }

        function createTask(task) {
            let box = document.createElement('div');
            box.classList.add('box');

            let result = document.createElement('div');
            result.classList.add('result');
            result.innerHTML = task;

            let deleteBtn = document.createElement('button');
            deleteBtn.classList.add('delete');
            deleteBtn.appendChild(document.createTextNode('delete'));

            deleteBtn.onclick = function() {
                box.remove();
                tasks = tasks.filter(t => t !== task);
                localStorage.setItem("tasks", JSON.stringify(tasks));
            };

            box.appendChild(result);
            box.appendChild(deleteBtn);
            resultContainer.appendChild(box);
        }

        function add() {
            if(input.value != '') {
                createTask(input.value);
                tasks.push(input.value);
                localStorage.setItem("tasks", JSON.stringify(tasks));
                input.value = '';
            } else {
                alert("Nothing to add");
            }
        }
            

    </script>
    
</body>
</html>
